services:
    backend:
        build: .
        ports:
            - "3000:3000"
        environment:
            DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/webapp
            REDIS_URL: redis://redis:6379
        depends_on:
            - postgres
            - redis

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: webapp
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
            
volumes:
    postgres_data: