services:
    backend:
        build: .
        ports:
            - "3000:3000"
        environment:
            DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/webapp
            REDIS_URL: redis://redis:6379
            FINNHUB_API_KEY: ${FINNHUB_API_KEY}
            
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${DB_PASSWORD}   # currently running only one container, so password is not used in render
            POSTGRES_DB: webapp
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"

volumes:
    postgres_data: